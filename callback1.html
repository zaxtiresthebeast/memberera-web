<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MemberEra — Authorizing</title>
<link rel="icon" type="image/png" href="/bot.png">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --blue: #3B82F6;
  --blue-bright: #60A5FA;
  --yellow: #FACC15;
  --green: #22c55e;
  --red: #ef4444;
  --bg: #070a12;
  --bg-2: #0d1220;
  --card: #121826;
  --border: #1e2739;
  --text: #e5e7eb;
  --text-dim: #94a3b8;
  --text-mute: #64748b;
}
html, body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
.card {
  background: linear-gradient(180deg, var(--card) 0%, var(--bg-2) 100%);
  border: 1px solid var(--border);
  border-radius: 22px;
  width: 100%;
  max-width: 460px;
  padding: 40px 32px 36px;
  box-shadow: 0 30px 80px rgba(0, 0, 0, 0.5);
}
.header { display: flex; align-items: center; gap: 14px; margin-bottom: 30px; padding-bottom: 22px; border-bottom: 1px solid var(--border); }
.logo { width: 52px; height: 52px; border-radius: 14px; border: 2px solid rgba(59, 130, 246, 0.35); }
.brand h1 { font-size: 18px; font-weight: 800; background: linear-gradient(90deg, var(--blue-bright), var(--yellow)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
.brand p { font-size: 12px; color: var(--text-mute); margin-top: 2px; }
.status { border-radius: 14px; padding: 22px 20px; display: flex; gap: 16px; align-items: flex-start; margin-bottom: 22px; border: 1px solid; }
.status.success { background: rgba(34, 197, 94, 0.08); border-color: rgba(34, 197, 94, 0.28); }
.status.error { background: rgba(239, 68, 68, 0.08); border-color: rgba(239, 68, 68, 0.28); }
.status.info { background: rgba(59, 130, 246, 0.08); border-color: rgba(59, 130, 246, 0.28); }
.status-icon { width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 22px; }
.status.success .status-icon { background: rgba(34, 197, 94, 0.15); }
.status.error .status-icon { background: rgba(239, 68, 68, 0.15); }
.status.info .status-icon { background: rgba(59, 130, 246, 0.15); }
.status-text h2 { font-size: 15px; font-weight: 700; margin-bottom: 6px; }
.status.success .status-text h2 { color: #4ade80; }
.status.error .status-text h2 { color: #f87171; }
.status.info .status-text h2 { color: var(--blue-bright); }
.status-text p { font-size: 13.5px; color: var(--text-dim); }
.debug { background: #000; border: 1px solid var(--border); border-radius: 10px; padding: 14px; font-family: monospace; font-size: 11px; color: #94a3b8; margin-top: 20px; white-space: pre-wrap; word-break: break-all; max-height: 200px; overflow-y: auto; }
</style>
</head>
<body>
<div class="card">
  <div class="header">
    <img src="/bot.png" alt="MemberEra" class="logo" onerror="this.style.display='none'">
    <div class="brand">
      <h1>MEMBERERA</h1>
      <p>Authorization Portal</p>
    </div>
  </div>
  <div class="status info" id="status-box">
    <div class="status-icon" id="status-icon">🔐</div>
    <div class="status-text">
      <h2 id="status-title">Checking</h2>
      <p id="status-msg">Please wait...</p>
    </div>
  </div>
  <div class="debug" id="debug">Starting...</div>
</div>
<script>
const UPSTASH_URL = "https://keen-goose-317190.upstash.io";
const UPSTASH_TOKEN = "ggAAAAAABNcGAAIgcDLAzy4hj0gj5JdM9yXvr6bF2HjgBS0yU2Va4KufMQf7pg";
const BOT2_CLIENT_ID = "1553955545311092846";
const BOT2_REDIRECT_URI = "https://memberera.kdns.fr/callback2.html";

const debug = document.getElementById("debug");
function log(msg) {
  debug.textContent += "\n" + msg;
  console.log(msg);
}

function setStatus(type, icon, title, msg) {
  document.getElementById("status-box").className = "status " + type;
  document.getElementById("status-icon").textContent = icon;
  document.getElementById("status-title").textContent = title;
  document.getElementById("status-msg").textContent = msg;
}

(async function () {
  log("Page loaded");
  const params = new URLSearchParams(location.search);
  const code = params.get("code");
  const state = params.get("state");
  log("code: " + (code ? code.slice(0, 10) + "..." : "MISSING"));
  log("state: " + (state ? state.slice(0, 10) + "..." : "MISSING"));

  if (!code || !state) {
    setStatus("error", "❌", "Authorization Failed", "Missing params");
    log("EXIT: missing code or state");
    return;
  }

  try {
    const key = "memberera:oauthCodes";
    const getURL = UPSTASH_URL + "/get/" + encodeURIComponent(key);
    log("GET URL: " + getURL);

    const getRes = await fetch(getURL, {
      headers: { Authorization: "Bearer " + UPSTASH_TOKEN }
    });
    log("GET status: " + getRes.status);
    const getData = await getRes.json();
    log("GET response: " + JSON.stringify(getData).slice(0, 300));

    if (getData.error) throw new Error("GET failed: " + getData.error);

    let blob = {};
    if (getData.result) {
      try {
        blob = JSON.parse(getData.result);
        if (typeof blob === "string") blob = JSON.parse(blob);
        if (typeof blob !== "object" || blob === null || Array.isArray(blob)) blob = {};
      } catch (e) {
        log("parse error: " + e.message);
        blob = {};
      }
    }
    log("existing keys: " + Object.keys(blob).length);

    if (!blob[state] || typeof blob[state] !== "object") {
      blob[state] = { bot1_code: null, bot2_code: null, created_at: Date.now() };
    }
    blob[state].bot1_code = code;
    const raw = JSON.stringify(blob);
    log("payload length: " + raw.length);

    const setURL = UPSTASH_URL + "/set/" + encodeURIComponent(key) + "/" + encodeURIComponent(raw);
    log("SET URL length: " + setURL.length);

    const setRes = await fetch(setURL, {
      headers: { Authorization: "Bearer " + UPSTASH_TOKEN }
    });
    log("SET status: " + setRes.status);
    const setData = await setRes.json();
    log("SET response: " + JSON.stringify(setData).slice(0, 300));

    if (setData.error) throw new Error("SET failed: " + setData.error);
    if (setData.result !== "OK") throw new Error("SET did not return OK: " + JSON.stringify(setData));

    setStatus("success", "✅", "Bot 1 Authorized", "Redirecting you to Bot 2 authorization...");
    log("SUCCESS — redirecting in 900ms");

    const bot2Url =
      "https://discord.com/oauth2/authorize" +
      "?client_id=" + BOT2_CLIENT_ID +
      "&redirect_uri=" + encodeURIComponent(BOT2_REDIRECT_URI) +
      "&response_type=code" +
      "&scope=identify%20guilds%20guilds.join%20guilds.members.read" +
      "&state=" + state;

    setTimeout(() => { window.location.href = bot2Url; }, 900);
  } catch (e) {
    setStatus("error", "❌", "Authorization Failed", e.message);
    log("EXCEPTION: " + e.message);
  }
})();
</script>
</body>
</html>
