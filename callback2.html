<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MemberEra — Complete</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: #1e1f22; color: #dbdee1;
  min-height: 100vh; display: flex; align-items: center; justify-content: center;
  padding: 20px; font-size: 15px; line-height: 1.5;
}
.card {
  background: #2b2d31; border-radius: 10px;
  width: 100%; max-width: 440px; padding: 32px 28px;
  box-shadow: 0 4px 20px rgba(0,0,0,.3);
}
h1 { font-size: 18px; color: #57F287; margin-bottom: 12px; text-align: center; }
p { font-size: 14px; color: #b5bac1; margin-bottom: 12px; text-align: center; }
.code-box {
  background: #1e1f22; border: 1px solid #3f4147; border-radius: 8px;
  padding: 18px; text-align: center; margin: 20px 0;
  font-family: 'SF Mono', Consolas, monospace;
  font-size: 22px; font-weight: 700; color: #5865F2;
  letter-spacing: 2px; user-select: all; cursor: pointer;
  transition: all .2s;
}
.code-box:hover { border-color: #5865F2; background: #1e1f24; }
.hint { font-size: 12px; color: #949ba4; text-align: center; }
.error { color: #ed4245; font-size: 13px; margin-top: 12px; text-align: center; }
</style>
</head>
<body>
<div class="card">
  <h1>Authorization Complete</h1>
  <p>Copy this key and paste it in Discord:</p>
  <div class="code-box" id="code-box">LOADING...</div>
  <p class="hint">Tap the key to copy</p>
  <p id="error" class="error"></p>
</div>

<script>
const UPSTASH_URL = "https://keen-goose-317190.upstash.io";
const UPSTASH_TOKEN = "gQAAAAAABNcGAAIgcDIyMTM0MTdmZDUwNzc0NmQ5OWFhODIxOWRhYWE3ZjU3Nw";

async function redisGet(key) {
  const res = await fetch(`${UPSTASH_URL}/get/${encodeURIComponent(key)}`, {
    headers: { Authorization: `Bearer ${UPSTASH_TOKEN}` }
  });
  const data = await res.json();
  return data.result;
}

async function redisSet(key, value) {
  const res = await fetch(`${UPSTASH_URL}/set/${encodeURIComponent(key)}`, {
    method: "POST",
    headers: {
      Authorization: `Bearer ${UPSTASH_TOKEN}`,
      "Content-Type": "application/json"
    },
    body: JSON.stringify(value)
  });
  return res.ok;
}

function safeParse(raw) {
  if (!raw) return {};
  try {
    let obj = JSON.parse(raw);
    if (typeof obj === "string") obj = JSON.parse(obj);
    if (typeof obj !== "object" || obj === null || Array.isArray(obj)) return {};
    return obj;
  } catch (_) {
    return {};
  }
}

(async function () {
  const params = new URLSearchParams(location.search);
  const code = params.get("code");
  const state = params.get("state");
  const codeBox = document.getElementById("code-box");
  const errorEl = document.getElementById("error");

  if (!code || !state) {
    codeBox.textContent = "ERROR";
    errorEl.textContent = "Missing code or state in URL.";
    return;
  }

  try {
    let oauthBlob = safeParse(await redisGet("memberera:oauthCodes"));
    if (!oauthBlob[state] || typeof oauthBlob[state] !== "object") {
      oauthBlob[state] = { bot1_code: null, bot2_code: null, created_at: Date.now() };
    }
    oauthBlob[state].bot2_code = code;
    await redisSet("memberera:oauthCodes", JSON.stringify(oauthBlob));

    const chars = "ABCDEFGHJKMNPQRSTUVWXYZ23456789";
    let authKey = "AUTH-";
    for (let i = 0; i < 6; i++) authKey += chars[Math.floor(Math.random() * chars.length)];

    let authBlob = safeParse(await redisGet("memberera:authCodes"));
    authBlob[authKey] = { state, created_at: Date.now() };
    await redisSet("memberera:authCodes", JSON.stringify(authBlob));

    codeBox.textContent = authKey;
    codeBox.addEventListener("click", () => {
      navigator.clipboard.writeText(authKey);
      const orig = codeBox.textContent;
      codeBox.textContent = "Copied!";
      codeBox.style.color = "#57F287";
      setTimeout(() => {
        codeBox.textContent = orig;
        codeBox.style.color = "";
      }, 1500);
    });
  } catch (e) {
    codeBox.textContent = "ERROR";
    errorEl.textContent = `Error: ${e.message}`;
  }
})();
</script>
</body>
</html>
